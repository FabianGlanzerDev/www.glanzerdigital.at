<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="utf-8"/>
<meta content="noindex,nofollow" name="robots"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<!-- Beschreibung für den Link, das man liest was es ist-->
<meta content="Ein responsiver Pokédex mit Daten aus der PokéAPI." name="description"/>
<title>Pokédex</title>
<link href="./assets/images/Favicon.png" rel="icon"/>
<link href="https://pokeapi.co" rel="preconnect"/>
<link href="styles/style.css" rel="stylesheet"/>
<script defer="" src="./scripts/pokemon-templates.js"></script>
<script defer="" src="./scripts/main.js"></script>
<link href="../_shared/portfolio-back.css" rel="stylesheet"/></head>
<body><a aria-label="Zurück zum Portfolio" class="gd-back-to-portfolio" href="../../subpages/portfolio.html">← Zurück zum Portfolio</a>
<header class="site-header">
<div class="header-content">
<a aria-label="Pokédex Startseite" class="logo" href="#">
<span class="logo-ball"></span>
<span>Pokédex</span>
</a>
<form class="search-form" id="searchForm">
<div class="search-wrapper">
<input aria-label="Pokémon durchsuchen" autocomplete="off" id="searchInput" placeholder="Pokémon suchen..." type="text"/>
<div class="suggestion-box" id="suggestionBox"></div>
</div>
<button type="submit">Suchen</button>
</form>
<button class="hidden" id="backHomeButton">suche reseten</button>
</div>
</header>
<main class="page-wrapper">
<section class="hero">
<div>
<p class="eyebrow">Trainer Register</p>
<h1>Finde dein Lieblings-Pokémon</h1>
</div>
<p class="hero-text">Durchsuche Pokémon, öffne Detailkarten und sieh dir Werte, Fähigkeiten und Typen an.</p>
</section>
<p aria-live="polite" class="message" id="messageBox"></p>
<section aria-label="Pokémon Karten" class="pokemon-grid" id="pokemonGrid"></section>
<div class="load-more-wrapper">
<button class="load-more-button" id="loadMoreButton">Weitere 20 Pokémon laden</button>
</div>
</main>
<div aria-live="polite" class="loader-overlay hidden" id="loaderOverlay">
<div class="loader-card">
<span class="spinner"></span>
<p>Pokémon werden geladen...</p>
</div>
</div>
<div aria-hidden="true" class="detail-overlay hidden" id="detailOverlay">
<article aria-labelledby="detailName" aria-modal="true" class="detail-card" id="detailCard" role="dialog">
<button aria-label="Detailansicht schließen" class="close-button" id="closeOverlayButton" type="button">×</button>
<div id="detailContent"></div>
<div class="detail-navigation">
<button aria-label="Vorheriges Pokémon" id="previousPokemonButton" type="button">‹</button>
<button aria-label="Nächstes Pokémon" id="nextPokemonButton" type="button">›</button>
</div>
</article>
</div>
<footer class="footer">
<div class="footer-content">
<div class="footer-brand">
<img alt="Fabs Dev Logo" src="./assets/images/fabsdev.png"/>
<span>Fabs Dev</span>
</div>
<a class="github-link" href="https://github.com/FabianGlanzerDev" target="_blank">
<img alt="GitHub Logo" src="./assets/images/github_PNG65.png"/>
</a>
</div>
</footer>
</body>
</html>
