<!DOCTYPE html>

<html lang="en">
<head>
<meta content="noindex,nofollow" name="robots"/><meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Memory</title>
<meta content="#303131" name="theme-color"/>
<meta content="yes" name="mobile-web-app-capable"/>
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/>
<meta content="Memory" name="apple-mobile-web-app-title"/>
<link href="./manifest.webmanifest" rel="manifest"/>
<link href="./icons/apple-touch-icon.png" rel="apple-touch-icon"/>
<link href="./assets/favicon-COVsSSxf.png" rel="icon" type="image/png"/>
<script defer="" src="./assets/main.js"></script>
<link href="./assets/style.css" rel="stylesheet"/>
<link href="portfolio-back.css" rel="stylesheet"/></head>
<body><a aria-label="Zurück zum Portfolio" class="gd-back-to-portfolio" href="https://glanzerdigital.at/portfolio">← Zurück zum Portfolio</a>
<main id="app">
<section aria-labelledby="home-title" class="home-screen" id="home-screen">
<img alt="" class="controller" src="./assets/controller-CcsXEKot.svg"/>
<div class="home-content">
<span class="home-subtitle">It's play time.</span>
<h1 id="home-title">Ready to play?</h1>
<button class="play-button" id="play-button" type="button">

<span>Play</span>
<span aria-hidden="true" class="play-button-arrow"></span>
</button>
</div>
</section>
<section aria-labelledby="settings-title" class="settings-screen hidden" id="settings-screen">
<div class="settings-wrapper">
<div class="settings-options">
<h2 id="settings-title">Settings</h2>
<fieldset class="settings-group">
<legend>
<img alt="" src="./assets/themes-C1dNqI-d.svg"/>
<span>Game themes</span>
</legend>
<label>
<input checked="" name="theme" type="radio" value="coding"/>
<span>Code vibes theme</span>
</label>
<label>
<input name="theme" type="radio" value="gaming"/>
<span>Gaming theme</span>
</label>
<label>
<input name="theme" type="radio" value="projects"/>
<span>DA Projects theme</span>
</label>
<label>
<input name="theme" type="radio" value="foods"/>
<span>Foods theme</span>
</label>
</fieldset>
<fieldset class="settings-group">
<legend>
<img alt="" src="./assets/player-Br6kYaiJ.svg"/>
<span>Choose player</span>
</legend>
<label>
<input name="player" type="radio" value="blue"/>
<span>Blue</span>
</label>
<label>
<input name="player" type="radio" value="orange"/>
<span>Orange</span>
</label>
</fieldset>
<fieldset class="settings-group">
<legend>
<img alt="" src="./assets/board-size-CGOqKs9s.svg"/>
<span>Board size</span>
</legend>
<label>
<input name="board-size" type="radio" value="16"/>
<span>16 cards</span>
</label>
<label>
<input name="board-size" type="radio" value="24"/>
<span>24 cards</span>
</label>
<label>
<input name="board-size" type="radio" value="36"/>
<span>36 cards</span>
</label>
</fieldset>
</div>
<div class="settings-preview">
<img alt="Preview of the selected memory theme" class="theme-preview" id="theme-preview" src="./assets/coding-vibes-BAsmuakM.svg"/>
<div class="settings-summary">
<span class="settings-summary-value" id="selected-theme">Code vibes theme</span>
<span aria-hidden="true" class="summary-divider"></span>
<span class="settings-summary-value" id="selected-player">Player</span>
<span aria-hidden="true" class="summary-divider"></span>
<span class="settings-summary-value" id="selected-board-size">Board size</span>
<button class="start-button" disabled="" id="start-button" type="button">
<span aria-hidden="true" class="start-button-icon"></span>
<span>Start</span>
</button>
</div>
</div>
</div>
</section>
<section aria-label="Memory game" class="game-screen hidden" data-size="16" data-theme="coding" id="game-screen">
<header class="game-header">
<div aria-label="Current score" aria-live="polite" class="score-panel">
<span class="score-badge score-blue">
<span aria-hidden="true" class="score-dot"></span>
                        Blue
                        <strong id="blue-score">0</strong>
</span>
<span class="score-badge score-orange">
<span aria-hidden="true" class="score-dot"></span>
                        Orange
                        <strong id="orange-score">0</strong>
</span>
</div>
<div aria-live="polite" class="current-player-box">
<span>Current player:</span>
<span aria-hidden="true" class="current-player-indicator" data-player="blue" id="current-player-indicator"></span>
<strong id="current-player">Blue</strong>
</div>
<button class="exit-button" id="exit-button" type="button">
<span aria-hidden="true" class="exit-button-icon"></span>
<span>Exit game</span>
</button>
</header>
<div aria-label="Memory game board" class="game-board" id="game-board"></div>
</section>
<div aria-hidden="true" aria-labelledby="exit-modal-title" aria-modal="true" class="exit-modal hidden" data-theme="coding" id="exit-modal" role="dialog">
<div class="exit-modal-card">
<h2 id="exit-modal-title">Are you sure you want to quit the game?</h2>
<div class="exit-modal-actions">
<button class="exit-modal-button exit-modal-back" id="back-to-game-button" type="button">
                        Back to game
                    </button>
<button class="exit-modal-button exit-modal-confirm" id="confirm-exit-button" type="button">
                        Exit game
                    </button>
</div>
</div>
</div>
<section aria-live="polite" class="result-screen game-over-screen hidden" data-theme="coding" id="game-over-screen">
<div class="result-content">
<h2 id="game-over-title">Game over</h2>
<p>Final score</p>
<div class="final-score">
<span class="final-score-item final-score-orange">
                        Orange
                        <strong id="game-over-orange-score">0</strong>
</span>
<span class="final-score-item final-score-blue">
                        Blue
                        <strong id="game-over-blue-score">0</strong>
</span>
</div>
</div>
</section>
<section aria-live="polite" class="result-screen winner-screen hidden" data-theme="coding" id="winner-screen">
<div aria-hidden="true" class="confetti-layer">
<span class="confetti-piece"></span>
<span class="confetti-piece"></span>
<span class="confetti-piece"></span>
<span class="confetti-piece"></span>
<span class="confetti-piece"></span>
<span class="confetti-piece"></span>
<span class="confetti-piece"></span>
<span class="confetti-piece"></span>
<span class="confetti-piece"></span>
<span class="confetti-piece"></span>
<span class="confetti-piece"></span>
<span class="confetti-piece"></span>
<span class="confetti-piece"></span>
<span class="confetti-piece"></span>
<span class="confetti-piece"></span>
<span class="confetti-piece"></span>
</div>
<div class="result-content">
<p class="winner-kicker" id="winner-kicker">The winner is</p>
<h2 id="winner-title">Blue Player</h2>
<span aria-hidden="true" class="result-icon" data-icon="pawn" id="result-icon"></span>
<div class="result-actions">
<button class="new-game-button" id="back-to-settings-button" type="button">
                        Back to settings
                    </button>
<button class="rematch-button" id="rematch-button" type="button">
                        Rematch
                    </button>
</div>
</div>
</section>
</main>
</body>
</html>
