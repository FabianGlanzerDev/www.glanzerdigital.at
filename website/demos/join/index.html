<!DOCTYPE html>

<html lang="en">
<head>
<meta content="noindex,nofollow" name="robots"/><meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Join-Login</title>
<link href="./assets/icons/favicon.webp" rel="shortcut icon" type="image/x-icon"/>
<link href="./styles/variables.css" rel="stylesheet"/>
<link href="./styles/fonts.css" rel="stylesheet"/>
<link href="./styles/assets.css" rel="stylesheet"/>
<link href="./styles/style.css" rel="stylesheet"/>
<link href="./styles/index.css" rel="stylesheet"/>
<link href="./styles/compactDesktop.css" rel="stylesheet"/>
<script defer="" src="./scripts/firebaseConfig.js"></script>
<script src="./scripts/firebaseInit.js" type="module"></script>
<script defer="" src="./scripts/main.js"></script>
<script defer="" src="./scripts/index.js"></script>
<link href="../_shared/portfolio-back.css" rel="stylesheet"/></head>
<body class="login-page intro-running"><a aria-label="Zurück zum Portfolio" class="gd-back-to-portfolio" href="../../subpages/portfolio.html">← Zurück zum Portfolio</a>
<div aria-hidden="true" class="intro-layer">
<picture>
<source media="(width &lt;= 768px)" srcset="./assets/icons/joinLogoLight.webp"/>
<img alt="" class="intro-logo" src="./assets/icons/joinLogoDark.webp"/>
</picture>
</div>
<div class="login-content">
<header class="login-header">
<img alt="Join Logo" class="login-logo" id="loginLogo" src="./assets/icons/joinLogoDark.webp"/>
</header>
<main class="login-main">
<form class="card" id="loginForm" novalidate="">
<h1>Log in</h1>
<div class="input-wrap margin-bottom">
<label class="visually-hidden" for="email">Email</label>
<input autocomplete="email" id="email" name="email" placeholder="Email" type="email"/>
<img alt="" class="icon" src="./assets/icons/mail.webp"/>
</div>
<div class="input-wrap">
<label class="visually-hidden" for="password">Password</label>
<input autocomplete="current-password" id="password" name="password" placeholder="Password" type="password"/>
<button aria-label="Show password" class="icon-toggle" disabled="" id="togglePasswordButton" type="button">
<img alt="" id="toggleIcon" src="./assets/icons/lock.webp"/>
</button>
</div>
<p aria-live="polite" class="error-msg" id="errorMessage"></p>
<div class="btn-row">
<button class="login-btn" type="submit">Log in</button>
<button class="guest-btn" type="button">Guest Log in</button>
</div>
</form>
</main>
<div class="signup-area">
<span>Not a Join user?</span>
<a class="signup-btn" href="./subpages/signUp.html">Sign up</a>
</div>
<footer class="login-footer">
<a href="./subpages/privacyPolicy.html">Privacy Policy</a>
<a href="./subpages/legalNotice.html">Legal Notice</a>
</footer>
</div>
</body>
</html>
