<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign up</title>
<link href="../assets/icons/favicon.webp" rel="shortcut icon" type="image/x-icon"/>
<link href="../styles/assets.css" rel="stylesheet"/>
<link href="../styles/variables.css" rel="stylesheet"/>
<link href="../styles/fonts.css" rel="stylesheet"/>
<link href="../styles/signUp.css" rel="stylesheet"/>
<link href="../styles/compactDesktop.css" rel="stylesheet"/>
<script defer="" src="../scripts/firebaseConfig.js"></script>
<script src="../scripts/firebaseInit.js" type="module"></script>
<script defer="" src="../scripts/main.js"></script>
<script defer="" src="../scripts/signUp.js"></script>
<link href="../../_shared/portfolio-back.css" rel="stylesheet"/></head>
<body class="sign-up-page"><a aria-label="Zurück zum Portfolio" class="gd-back-to-portfolio" href="../../../subpages/portfolio.html">← Zurück zum Portfolio</a>
<div class="sign-up-content">
<header class="sign-up-header">
<img alt="Join logo" class="sign-up-logo" src="../assets/icons/joinLogoDark.webp"/>
</header>
<main class="signup-main">
<div class="textbox">
<div class="text-box">
<a aria-label="Back to login" class="back-to-login back-arrow-button" href="../index.html">
<img alt="" aria-hidden="true" src="../assets/icons/backArrowDarkBlue.webp"/>
</a>
<div class="textbox-signup">
<h1>Sign up</h1>
</div>
<div class="textbox-inputfield-wrapper">
<form class="textbox-inputfield" id="signupForm" novalidate="">
<div class="signup-input-field">
<label class="visually-hidden" for="username">Name</label>
<input autocomplete="name" id="username" name="name" placeholder="Name" type="text"/>
<img alt="" aria-hidden="true" src="../assets/icons/person.webp"/>
</div>
<p aria-live="polite" class="error-msg" id="usernameError"></p>
<div class="signup-input-field">
<label class="visually-hidden" for="email">Email</label>
<input autocomplete="email" id="email" name="email" placeholder="Email" type="email"/>
<img alt="" aria-hidden="true" src="../assets/icons/mail.webp"/>
</div>
<p aria-live="polite" class="error-msg" id="emailError"></p>
<div class="signup-input-field">
<label class="visually-hidden" for="password">Password</label>
<input autocomplete="new-password" id="password" name="password" placeholder="Password" type="password"/>
<button aria-label="Show password" class="password-toggle" disabled="" id="passwordToggle" type="button">
<img alt="" id="passwordIcon" src="../assets/icons/lock.webp"/>
</button>
</div>
<p aria-live="polite" class="error-msg" id="passwordError"></p>
<div class="signup-input-field">
<label class="visually-hidden" for="confirmPassword">Confirm password</label>
<input autocomplete="new-password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" type="password"/>
<button aria-label="Show confirm password" class="password-toggle" disabled="" id="confirmPasswordToggle" type="button">
<img alt="" id="confirmPasswordIcon" src="../assets/icons/lock.webp"/>
</button>
</div>
<p aria-live="polite" class="error-msg" id="confirmPasswordError"></p>
<p aria-live="polite" class="error-msg" id="errorMessage"></p>
<div class="textbox-checkbox">
<span class="custom-checkbox-wrapper">
<input id="termsCheckbox" name="termsAccepted" type="checkbox"/>
<span aria-hidden="true" class="custom-checkbox"></span>
</span>
<label for="termsCheckbox">I accept the</label>
<a href="./privacyPolicy.html">Privacy policy</a>
</div>
<div class="btn">
<button class="signup-btn" disabled="" id="signupBtn" type="submit">
                  Sign up
                </button>
</div>
</form>
</div>
</div>
</div>
</main>
<footer>
<a href="./privacyPolicy.html">Privacy Policy</a>
<a href="./legalNotice.html">Legal notice</a>
</footer>
</div>
<div aria-atomic="true" aria-live="polite" class="signup-toast" role="status"></div>
</body>
</html>
