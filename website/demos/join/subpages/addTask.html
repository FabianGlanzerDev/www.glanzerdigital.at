<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Task</title>
<link href="../assets/icons/favicon.webp" rel="shortcut icon" type="image/x-icon"/>
<link href="../styles/variables.css" rel="stylesheet"/>
<link href="../styles/assets.css" rel="stylesheet"/>
<link href="../styles/fonts.css" rel="stylesheet"/>
<link href="../styles/sidebar.css" rel="stylesheet"/>
<link href="../styles/header.css" rel="stylesheet"/>
<link href="../styles/style.css" rel="stylesheet"/>
<link href="../styles/addTask.css" rel="stylesheet"/>
<link href="../styles/compactDesktop.css" rel="stylesheet"/>
<script defer="" src="../scripts/main.js"></script>
<script defer="" src="../scripts/taskInteractionHelper.js"></script>
<script defer="" src="../templates/barsTemplates.js"></script>
<script defer="" src="../templates/addTaskTemplates.js"></script>
<script defer="" src="../scripts/bars.js"></script>
<script defer="" src="../scripts/taskDropdownHelper.js"></script>
<script defer="" src="../scripts/addTaskHelper.js"></script>
<script defer="" src="../scripts/addTaskData.js"></script>
<script defer="" src="../scripts/addTaskDate.js"></script>
<script defer="" src="../scripts/addTask.js"></script>
<link href="../../_shared/portfolio-back.css" rel="stylesheet"/></head>
<body data-page="add-task"><a aria-label="Zurück zum Portfolio" class="gd-back-to-portfolio" href="../../../subpages/portfolio.html">← Zurück zum Portfolio</a>
<aside class="sidebar" id="sidebar"></aside>
<section aria-label="Seiteninhalt" class="page-content">
<header class="topbar" id="topbar"></header>
<main class="main-content add-task-content">
<h1 class="site-header">Add Task</h1>
<form class="add-task-form">
<div class="add-task-fields-left">
<label class="label" for="title">
                        Title<span class="required-marker">*</span>
</label>
<input class="input-field" id="title" placeholder="Enter a title" type="text"/>
<div class="error-message" id="titleError"></div>
<label class="labelTextarea" for="description">Description</label>
<textarea class="textarea" id="description" placeholder="Enter a Description"></textarea>
<label class="label" for="dueDate">
                        Due date<span class="required-marker">*</span>
</label>
<input class="input-field" id="dueDate" placeholder="dd/mm/yyyy" type="text"/>
<div class="error-message" id="dueDateError"></div>
</div>
<div class="horizontal-divider"></div>
<div class="add-task-fields-right">
<div class="field-label" id="priorityLabel">Priority</div>
<div aria-labelledby="priorityLabel" class="priority-group" role="radiogroup">
<input id="urgent" name="priority" type="radio" value="urgent"/>
<label for="urgent" role="radio" tabindex="0">
                            Urgent
                            <img alt="Urgent priority icon" src="../assets/icons/urgentPriority.webp"/>
</label>
<input checked="" id="medium" name="priority" type="radio" value="medium"/>
<label class="medium" for="medium" role="radio" tabindex="0">
                            Medium
                            <img alt="Medium priority icon" src="../assets/icons/mediumPriority.webp"/>
</label>
<input id="low" name="priority" type="radio" value="low"/>
<label for="low" role="radio" tabindex="0">
                            Low
                            <img alt="Low priority icon" src="../assets/icons/lowPriority.webp"/>
</label>
</div>
<div class="dropdown-list">
<label class="assigned-to" for="assignedTo">Assigned to</label>
<div class="input-wrapper">
<input class="assigned-to" id="assignedTo" placeholder="Select contacts to assign" type="text"/>
<img alt="Toggle contacts dropdown" class="input-icon" src="../assets/icons/arrowDropdown.webp"/>
<div class="dropdown-content"></div>
</div>
<div class="selected-contacts"></div>
</div>
<div class="dropdown-list">
<label class="category" for="category">
                            Category<span class="required-marker">*</span>
</label>
<div class="input-wrapper">
<input class="category" id="category" placeholder="Select task category" readonly="" type="text"/>
<img alt="Toggle category dropdown" class="input-icon" src="../assets/icons/arrowDropdown.webp"/>
<div class="dropdown-content">
<a href="">Technical Task</a>
<a href="">User Story</a>
</div>
</div>
<div class="error-message" id="categoryError"></div>
<label class="label" for="subtasks">Subtasks</label>
<div class="subtask-input-wrapper">
<input class="input-field" id="subtasks" placeholder="Add new subtasks" type="text"/>
<div class="subtask-actions">
<button aria-label="Discard subtask input" class="subtask-cancel" disabled="" tabindex="0" type="button">
<img alt="" src="../assets/icons/cancel.webp"/>
</button>
<span class="subtask-divider"></span>
<button aria-label="Add subtask" class="subtask-check" disabled="" tabindex="0" type="button">
<img alt="" src="../assets/icons/check.webp"/>
</button>
</div>
</div>
<ul class="subtask-list"></ul>
</div>
</div>
</form>
<footer>
<p class="required-fields-notice">
<span class="required-marker">*</span>This field is required
                </p>
<div class="footer-buttons">
<button class="clear" onclick="clearForm()" type="button">
                        Clear
                        <img alt="Cancel icon" src="../assets/icons/cancel.webp"/>
</button>
<button class="create-task" type="button">
                        Create Task
                        <img alt="Check icon" src="../assets/icons/check.webp"/>
</button>
</div>
</footer>
</main>
</section>
<div class="task-added-toast">
<span>Task added to board</span>
<img alt="Board icon" src="../assets/icons/board.webp"/>
</div>
</body>
</html>
