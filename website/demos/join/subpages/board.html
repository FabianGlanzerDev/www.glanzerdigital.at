<body data-page="board"><a aria-label="Zurück zum Portfolio" class="gd-back-to-portfolio" href="../../../subpages/portfolio.html">← Zurück zum Portfolio</a>
<aside class="sidebar" id="sidebar"></aside>
<section aria-label="Seiteninhalt" class="page-content">
<header class="topbar" id="topbar"></header>
<main class="main-content board-main">
<section class="board">
<article class="board-header">
<h1>Board</h1>
<div class="board-actions">
<label class="task-search" for="taskSearch">
<input id="taskSearch" placeholder="Find Task" type="search"/>
<span aria-hidden="true" class="search-divider"></span>
<span class="search-icon-button">
<img alt="" class="search-icon" src="../assets/icons/searchIcon.webp"/>
</span>
</label>
<button class="add-task-button" data-task-column="todo" type="button">
<span class="add-task-label">Add task</span>
<span aria-hidden="true" class="add-task-plus">+</span>
</button>
</div>
</article>
<article class="board-columns">
<div class="board-column">
<div class="column-header">
<h2>To do</h2>
<button aria-label="Add task to To do" class="add-column-task" data-task-column="todo" type="button">
<img alt="" src="../assets/icons/addColumnTask.webp"/>
</button>
</div>
<div class="task-list" id="toDoTasks"></div>
</div>
<div class="board-column">
<div class="column-header">
<h2>In progress</h2>
<button aria-label="Add task to In progress" class="add-column-task" data-task-column="inprogress" type="button">
<img alt="" src="../assets/icons/addColumnTask.webp"/>
</button>
</div>
<div class="task-list" id="inProgressTasks"></div>
</div>
<div class="board-column">
<div class="column-header">
<h2>Await feedback</h2>
<button aria-label="Add task to Await feedback" class="add-column-task" data-task-column="awaitfeedback" type="button">
<img alt="" src="../assets/icons/addColumnTask.webp"/>
</button>
</div>
<div class="task-list" id="awaitFeedbackTasks"></div>
</div>
<div class="board-column">
<div class="column-header">
<h2>Done</h2>
</div>
<div class="task-list" id="doneTasks"></div>
</div>
</article>
<p aria-live="polite" class="visually-hidden" id="boardStatusMessage"></p>
</section>
</main>
</section>
</body>
</html>
