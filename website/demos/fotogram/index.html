<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="noindex,nofollow" name="robots"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Fotogram</title>



<link href="styles/style.css" rel="stylesheet"/>
<link href="./assets/images/favicon.png" rel="icon" type="image/x-icon"/>
<link href="../_shared/portfolio-back.css" rel="stylesheet"/></head>
<body onload="render()"><a aria-label="Zurück zum Portfolio" class="gd-back-to-portfolio" href="../../subpages/portfolio.html">← Zurück zum Portfolio</a>
<header class="header">
<img alt="Logo DA" class="fotogram_logo" src="./assets/images/fotogram_logo.png"/>
</header>
<main class="main">
<h1>Your personal photo album</h1>
<section class="gallery" id="gallery"></section>
<div class="lightbox" id="lightbox">
<div aria-describedby="lightbox-counter" aria-labelledby="lightbox-title" aria-modal="true" class="lightbox-modal" role="dialog" tabindex="-1">
<div class="lightbox-header">
<span class="lightbox-title" id="lightbox-title">Bildname</span>
<button aria-label="Lightbox schließen" class="close" id="close-btn" type="button">
                        ×
                    </button>
</div>
<img alt="Alle Bilder" class="lightbox-img" id="lightbox-img"/>
<div aria-label="Bildnavigation" class="lightbox-footer">
<button aria-label="Vorheriges Bild" class="prev" type="button">
<img alt="Bild Weiterschalten nach Links" src="./assets/images/pfeil_links_zurueck.png"/>
</button>
<span aria-live="polite" class="lightbox-counter" id="lightbox-counter">
                        1/12
                    </span>
<button aria-label="Nächstes Bild" class="next" type="button">
<img alt="Bild Weiterschalten nach Rechts" src="./assets/images/pfeil_rechts_weiter.png"/>
</button>
</div>
</div>
</div>
</main></body>
<script src="scripts/main.js"></script>
<footer class="footer">
<img alt="footer_logo" class="footer_logo" src="./assets/images/footer.png"/>
<img alt="DA Logo" class="footer_da_logo" src="./assets/images/developerakademie_logo.png"/>
</footer></html>
