              class="button button--secondary" href="/kontakt">Projekt anfragen</a></div>
        </div>
        <div class="error-terminal" aria-hidden="true"><span>&gt; request
            /unknown</span><strong>404</strong><code>route_not_found();</code><small>redirect: /</small></div>
      </div>
    </section>
  </main>
  <footer class="site-footer" data-site-footer></footer>
